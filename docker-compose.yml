version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    depends_on:
      - mongo

volumes:
  mongo_data:
